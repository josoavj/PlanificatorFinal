name: planificator
description: "Planificator Desktop - Plateforme de gestion et suivi de planning clients"

publish_to: 'none' 

version: 2.1.1+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  logger: ^2.6.2
  mysql1: ^0.22.0
  provider: ^6.1.5+1
  table_calendar: ^3.2.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  bcrypt: ^1.1.3
  collection: ^1.19.1
  url_launcher: ^6.2.0
  path: ^1.8.0
  syncfusion_flutter_xlsio: ^35.1.42
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  workmanager: ^0.10.10
  flutter_secure_storage: ^11.2.0
  google_fonts: ^8.2.1
  file_picker: ^13.1.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.6.3

  
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  image_path: "assets/icons/icon.png"
  windows:
    generate: true
    image_path: "assets/icons/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icons/icon.png"
  linux:
    generate: true
    image_path: "assets/icons/icon.png"

flutter:

  uses-material-design: true

  assets:
    - assets/Pictures/
    - assets/logo/
    - assets/icons/

